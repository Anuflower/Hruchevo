<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Хрючево</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

  <div class="topbar">

    <h1>Хрючево</h1>

    <button id="adminToggle">
      ＋
    </button>

  </div>

  <div id="filters"></div>

  <div id="gallery"></div>

  <div id="viewer" class="viewer hidden">

    <div class="viewer-overlay"></div>

    <div class="viewer-content">

      <button id="closeViewer">
        ✕
      </button>

      <img id="viewerImage" src="" />

      <div class="viewer-info">

        <div id="viewerDate"></div>

        <div id="viewerTags"></div>

        <div id="viewerDescription"></div>

        <a
          id="viewerPost"
          target="_blank"
        >
          Открыть пост
        </a>

      </div>

    </div>

  </div>

  <div id="adminPanel" class="admin hidden">

    <div class="admin-header">

      <h2>Добавить пост</h2>

      <button id="closeAdmin">
        ✕
      </button>

    </div>

    <input
      id="adminImage"
      placeholder="images/photo.jpg"
    />

    <input
      id="adminDate"
      placeholder="28.05.2026"
    />

    <input
      id="adminTags"
      placeholder="суп, чай, лапша"
    />

    <textarea
      id="adminDescription"
      placeholder="Описание..."
    ></textarea>

    <input
      id="adminPost"
      placeholder="https://t.me/..."
    />

    <button id="savePost">
      Сохранить
    </button>

  </div>

  <script
    type="module"
    src="script.js"
  ></script>

</body>

</html>
